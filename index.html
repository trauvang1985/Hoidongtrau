function nextBday(p){if(!p.bday)return null;const[y,m,d]=p.bday.split("-").map(Number),n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());let b=new Date(t.getFullYear(),m-1,d);if(b<t)b=new Date(t.getFullYear()+1,m-1,d);return{days:Math.round((b-t)/864e5),d,m,age:p.hideYear?null:b.getFullYear()-y}}
function bdays(){return Object.entries(S.P).map(([id,p])=>({p,b:nextBday(p)})).filter(x=>x.b).sort((a,b)=>a.b.days-b.b.days)}
function cnt(poll){const c={};Object.values(S.V).forEach(v=>{const o=v.choices?.[poll.id];if(o)c[o]=(c[o]||0)+1});return c}
function home(){const mine=S.P[S.me],al=[];
 if(!mine)al.push("Bạn chưa tạo hồ sơ. Vào tab Hồ sơ để khai báo phường và ngày sinh.");else if(mine.name==="Thành viên")al.push("Bạn chưa đặt tên hiển thị. Vào tab Hồ sơ để đổi tên, mọi người mới gắn thẻ @ bạn được trong Chat.");
 S.polls.filter(p=>p.closed).sort((a,b)=>(b.closedAt||0)-(a.closedAt||0)).slice(0,3).forEach(p=>{const o=p.options.find(o=>o.id===p.winner);al.push(`📌 Đã chốt ${p.kind==="time"?"thời gian":"địa điểm"} “${esc(p.title)}”: <b>${esc(o?.label)}</b>`)});
 const open=S.polls.filter(p=>!p.closed&&!S.V[S.me]?.choices?.[p.id]);if(open.length)al.push(`🗳️ Bạn chưa bình chọn ${open.length} mục. Vào tab Vote.`);
 const mm=mentionsMe();if(mm)al.push("💬 Có "+mm+" tin nhắn nhắc tên bạn trong Chat.");const bd=bdays().filter(x=>x.b.days<=45).slice(0,6);
 return `${al.map(a=>`<div class="card alert">${a}</div>`).join("")}
 <div class="card"><h3>🎂 Sinh nhật sắp tới</h3>${bd.map(({p,b})=>`<div class="row">${av(p,38)}<div class="grow"><b>${esc(p.name)}</b><div class="mu">${b.d}/${b.m}${b.age?` · tròn ${b.age} tuổi`:""}</div></div><span class="tag">${b.days===0?"Hôm nay!":"còn "+b.days+" ngày"}</span></div>`).join("")||'<div class="mu">Chưa có sinh nhật trong 45 ngày tới.</div>'}</div>
 <div class="card"><h3>👥 Thành viên (${Object.keys(S.P).length})</h3>${Object.values(S.P).map(p=>`<div class="row">${av(p,34)}<div class="grow">${esc(p.name)}<div class="mu">${esc(p.ward||"Chưa chọn phường")}</div></div></div>`).join("")||'<div class="mu">Chưa có ai.</div>'}</div>`}
const lastSeen=()=>{try{return +localStorage.getItem("seen")||0}catch(e){return 0}};
const markSeen=()=>{try{localStorage.setItem("seen",Date.now())}catch(e){}};
const newer=m=>Date.parse(m.created_at)>lastSeen()&&m.user_id!==S.me;
const unread=()=>(S.M||[]).filter(newer).length;
const mentionsMe=()=>(S.M||[]).filter(m=>newer(m)&&(m.mentions||[]).includes(S.me)).length;
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function msgHtml(){const ns=Object.values(S.P).map(p=>esc(p.name)).filter(Boolean).sort((a,b)=>b.length-a.length),re=ns.length?new RegExp("@("+ns.map(reEsc).join("|")+")","g"):null;
 return (S.M||[]).map(m=>{const p=S.P[m.user_id],d=new Date(m.created_at);let b=esc(m.body);if(re)b=b.replace(re,x=>`<span class="mn">${x}</span>`);
 return `<div class="msg ${m.user_id===S.me?"mine":""}">${av(p,30)}<div class="grow"><div class="mu"><b>${esc(p?.name||"Ẩn danh")}</b> · ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")} ${d.getDate()}/${d.getMonth()+1}</div><div>${b}</div></div></div>`}).join("")}
function updateMsgs(f){const el=$("#msgs");if(!el)return;const bot=f||el.scrollHeight-el.scrollTop-el.clientHeight<80;el.innerHTML=msgHtml()||'<div class="mu">Chưa có tin nhắn. Hãy mở đầu cuộc trò chuyện!</div>';if(bot)el.scrollTop=el.scrollHeight;markSeen()}
function chatv(){return `<div class="card"><h3>💬 Trò chuyện nhóm</h3><div id="msgs"></div><div id="sg" style="margin-top:6px"></div><div style="display:flex;gap:8px"><button class="s" data-a="atbtn" style="font-size:18px">@</button><input id="ci" placeholder="Nhắn tin, gõ @ để nhắc tên…" autocomplete="off" style="margin:0"><button class="p" data-a="send">Gửi</button></div></div>`}
function chatInit(){updateMsgs(true)}
async function sendMsg(){const i=$("#ci"),t=i.value.trim();if(!t)return;const ids=Object.entries(S.P).filter(([id,p])=>p.name&&t.includes("@"+p.name)).map(([id])=>id);i.value="";$("#sg").innerHTML="";
 try{await ck(sb.from("messages").insert({user_id:S.me,body:t,mentions:ids}));await load();updateMsgs(true)}catch(err){i.value=t;toast("Lỗi: "+(err.message||err.code))}}
function tagName(n){const i=$("#ci"),pos=i.selectionStart,v=i.value,b=v.slice(0,pos).replace(/@([^@\n]*)$/,()=>"@"+n+" ");i.value=b+v.slice(pos);i.focus();i.setSelectionRange(b.length,b.length);$("#sg").innerHTML=""}
function showSug(){const i=$("#ci"),sg=$("#sg");if(!i||!sg)return;const v=i.value.slice(0,i.selectionStart),m=v.match(/@([^@\n]*)$/);if(!m){sg.innerHTML="";return}const q=m[1].toLowerCase(),r=Object.entries(S.P).filter(([id,p])=>(p.name||"").toLowerCase().includes(q)).slice(0,6);sg.innerHTML=r.length?r.map(([id,p])=>`<button class="s" data-a="tag" data-n="${esc(p.name)}" style="margin:0 6px 6px 0">@${esc(p.name)}${id===S.me?" (bạn)":""}</button>`).join(""):'<div class="mu">Không có thành viên khớp tên này. Thành viên cần lưu hồ sơ có tên thì mới gắn thẻ được.</div>'}
document.addEventListener("input",e=>{if(e.target.id==="ci")showSug()});

function wardGroups(){const g={};Object.values(S.P).forEach(p=>{if(p.ward&&!(p.share&&p.lat))(g[p.ward]=g[p.ward]||[]).push(p)});return g}
const SEL0="Chạm vào ảnh trên bản đồ để xem ai ở phường đó.";
function selHtml(){const g=wardGroups();return S.wsel&&g[S.wsel]?`<h3>📍 ${esc(S.wsel)}</h3>`+g[S.wsel].map(p=>`<div class="row">${av(p,32)}${esc(p.name)}</div>`).join(""):SEL0}
function mapv(){return `<div class="card"><h3>🗺️ Bản đồ thành viên</h3><div id="lm"></div><div id="sel" class="mu" style="margin-top:8px"></div></div>`}
let LM=null;
function initMap(){if(typeof L==="undefined"){$("#lm").innerHTML='<div class="mu" style="padding:12px">Không tải được thư viện bản đồ.</div>';return}
 if(LM){try{LM.remove()}catch(e){}LM=null}
 const m=LM=L.map("lm").setView(S.view?S.view.c:[21.03,105.83],S.view?S.view.z:11);
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(m);
 const g=wardGroups(),pts=[];
 const pin=mem=>{const a=mem[0].avatar;return `<div style="position:relative;width:42px;height:42px"><div style="width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px #0006;overflow:hidden;background:#1d7a5a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">${a?`<img src="${esc(a)}" style="width:100%;height:100%;object-fit:cover">`:esc((mem[0].name||"?")[0].toUpperCase())}</div>${mem.length>1?`<span style="position:absolute;right:-4px;top:-4px;background:#b4531a;color:#fff;border-radius:99px;font-size:11px;padding:0 5px">${mem.length}</span>`:""}</div>`};
 const mk=(la,ln,mem,fn)=>{L.marker([la,ln],{icon:L.divIcon({html:pin(mem),className:"",iconSize:[42,42],iconAnchor:[21,21]})}).addTo(m).on("click",fn);pts.push([la,ln])};
 Object.values(S.P).filter(p=>p.share&&p.lat).forEach(p=>mk(p.lat,p.lng,[p],()=>{$("#sel").innerHTML=`<div class="row">${av(p,36)}<div><b>${esc(p.name)}</b><div class="mu">${esc(p.address||"")}${p.ward?" · "+esc(p.ward):""}</div></div></div>`}));
 W.filter(x=>g[x[0]]).forEach(x=>mk(x[1],x[2],g[x[0]],()=>{S.wsel=x[0];$("#sel").innerHTML=selHtml()}));
 if(!S.view&&pts.length)m.fitBounds(pts,{padding:[40,40],maxZoom:13});
 m.on("moveend",()=>{const c=m.getCenter();S.view={c:[c.lat,c.lng],z:m.getZoom()}});
 $("#sel").innerHTML=selHtml()}
let PM=null,PK=null;
function initPick(){const el=$("#pm");if(!el||typeof L==="undefined")return;if(PM){try{PM.remove()}catch(e){}}PM=PK=null;
 const p=S.P[S.me]||{},w=W.find(x=>x[0]===($("#fw")?.value||p.ward));
 if(!S.draft&&p.lat)S.draft={lat:p.lat,lng:p.lng};
 PM=L.map("pm").setView(S.draft?[S.draft.lat,S.draft.lng]:w?[w[1],w[2]]:[21.03,105.83],S.draft?17:w?14:11);
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(PM);
 PM._put=(la,ln)=>{S.draft={lat:la,lng:ln};if(PK)PK.setLatLng([la,ln]);else PK=L.marker([la,ln],{draggable:true}).addTo(PM).on("dragend",()=>{const q=PK.getLatLng();S.draft={lat:q.lat,lng:q.lng}})};
 if(S.draft)PM._put(S.draft.lat,S.draft.lng);
 PM.on("click",e=>PM._put(e.latlng.lat,e.latlng.lng))}
async function geocode(){const q=$("#fa").value.trim();if(!q)return toast("Nhập địa chỉ trước");
 try{const r=await (await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=vn&q="+encodeURIComponent(q+", Hà Nội"))).json();
 if(!r.length)return toast("Không tìm thấy. Hãy chạm vào bản đồ để đặt ghim.");
 PM._put(+r[0].lat,+r[0].lon);PM.setView([+r[0].lat,+r[0].lon],17);toast("Đã tìm thấy. Kéo ghim nếu cần chỉnh.")}catch(e){toast("Không tìm được địa chỉ lúc này")}}
document.addEventListener("change",e=>{if(e.target.id==="fw"&&PM&&!S.draft){const w=W.find(x=>x[0]===e.target.value);if(w)PM.setView([w[1],w[2]],14)}});
function votev(){const mg=pl=>S.admin||pl.createdBy===S.me,my=S.V[S.me]?.choices||{};
 const form=`<details class="card"><summary><b>＋ Tạo bình chọn mới</b></summary><div style="margin-top:8px"><label>Loại</label><select id="pk"><option value="time">Thời gian</option><option value="place">Địa điểm</option></select><label>Tiêu đề</label><input id="pt" placeholder="VD: Họp mặt tháng 11"><label>Các lựa chọn (mỗi dòng một mục)</label><textarea id="po" rows="4"></textarea><button class="p" data-a="newpoll">Đăng bình chọn</button></div></details>`;
 const list=[...S.polls].sort((a,b)=>(a.closed?1:0)-(b.closed?1:0)||(b.createdAt||0)-(a.createdAt||0)).map(pl=>{const c=cnt(pl),tot=Object.values(c).reduce((a,b)=>a+b,0)||1;
 return `<div class="card"><div class="row"><div class="grow"><b>${esc(pl.title)}</b><div class="mu">${pl.kind==="time"?"🕒 Thời gian":"📍 Địa điểm"}${pl.createdBy&&S.P[pl.createdBy]?" · tạo bởi "+esc(S.P[pl.createdBy].name):""}</div></div>${pl.closed?'<span class="tag">Đã chốt</span>':""}</div>${pl.options.map(o=>`<div class="opt ${my[pl.id]===o.id?"me":""} ${pl.winner===o.id?"me":""}" ${pl.closed?"":`data-a="vote" data-p="${pl.id}" data-o="${o.id}"`}><i style="width:${(c[o.id]||0)/tot*100}%"></i><span><span>${pl.winner===o.id?"✅ ":""}${esc(o.label)}</span><span>${c[o.id]||0}${mg(pl)&&!pl.closed?` <button class="s" data-a="close" data-p="${pl.id}" data-o="${o.id}">Chốt</button>`:""}</span></span></div>`).join("")}${mg(pl)?`<button class="s" data-a="delpoll" data-p="${pl.id}">Xóa</button>`:""}</div>`}).join("");
 return form+(list||'<div class="card mu">Chưa có bình chọn nào.</div>')}
function me(){const p=S.P[S.me]||{};return `<div class="card"><h3>Hồ sơ của bạn</h3><div class="row">${av(p,64)}<button class="s" data-a="pick">Đổi ảnh đại diện</button><input type="file" id="fi" accept="image/*" hidden></div>
 <label>Tên hiển thị</label><input id="fn" value="${esc(p.name)}"><label>Phường (địa giới mới)</label><select id="fw"><option value="">— Chọn phường —</option>${[...W].sort((a,b)=>a[0].localeCompare(b[0],"vi")).map(x=>`<option ${p.ward===x[0]?"selected":""}>${esc(x[0])}</option>`).join("")}</select>
 <label>Địa chỉ (số nhà, đường) - không bắt buộc</label><input id="fa" value="${esc(p.address)}" placeholder="VD: 12 Phố Huế"><button class="s" data-a="geo">🔍 Tìm trên bản đồ</button><div id="pm" style="height:230px;border-radius:12px;margin:8px 0;position:relative;z-index:0"></div><div class="mu" style="margin-bottom:8px">Kéo ghim hoặc chạm vào bản đồ để chỉnh đúng vị trí.</div><label><input type="checkbox" id="fs" ${p.share?"checked":""}>Chia sẻ vị trí chính xác này với cả nhóm. Nếu tắt, nhóm chỉ thấy phường của bạn và địa chỉ không được lưu.</label><br><br><label>Ngày sinh</label><input type="date" id="fb" value="${esc(p.bday)}"><label><input type="checkbox" id="fh" ${p.hideYear?"checked":""}>Ẩn năm sinh, chỉ hiện ngày/tháng</label><br><br><button class="p" data-a="save">Lưu hồ sơ</button> <button class="s" data-a="logout">Đăng xuất</button></div>`}
function render(f){const a=document.activeElement;if(!f&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=="range"){if(S.tab==="chat")updateMsgs();return}
 if(!S.me){$("#nav").innerHTML="";$("#hello").textContent="";$("#app").innerHTML=S.cfg===false?'<div class="card alert">Chưa cấu hình: mở index.html, điền SB_URL và SB_KEY.</div>':`<div class="card"><h3>Đăng nhập / đăng ký</h3><label>Email</label><input id="ae" type="email" autocomplete="email"><label>Mật khẩu (tối thiểu 6 ký tự)</label><input id="ap" type="password" autocomplete="current-password"><button class="p" data-a="login">Đăng nhập</button> <button class="s" data-a="signup">Đăng ký</button></div>`;return}
 const T=[["home","🏠","Tổng quan"],["map","🗺️","Bản đồ"],["vote","🗳️","Vote"],["chat","💬","Chat"],["me","👤","Hồ sơ"]];
 $("#nav").innerHTML=T.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-a="tab" data-t="${t[0]}"><b>${t[1]}</b>${t[2]}${t[0]==="chat"&&S.tab!=="chat"&&unread()?" ·"+unread():""}</button>`).join("");
 $("#hello").textContent=S.P[S.me]?"Xin chào, "+S.P[S.me].name+(S.admin?" · quản trị":""):"";
 const sc=$("#mapw")?.scrollLeft,st=$("#mapw")?.scrollTop;
 $("#app").innerHTML={home,map:mapv,vote:votev,me,chat:chatv}[S.tab]();if(S.tab==="map")initMap();if(S.tab==="chat")chatInit();if(S.tab==="me")initPick();
 if($("#mapw")&&sc!=null){$("#mapw").scrollLeft=sc;$("#mapw").scrollTop=st}}
const uid=()=>Math.random().toString(36).slice(2,9);
let img=null,cz={x:0,y:0,s:1};
function drawCrop(){const c=$("#cv").getContext("2d"),b=Math.max(240/img.width,240/img.height)*cz.s;c.clearRect(0,0,240,240);c.drawImage(img,120-img.width*b/2+cz.x,120-img.height*b/2+cz.y,img.width*b,img.height*b)}
const ck=async r=>{const x=await r;if(x.error)throw x.error;return x};
document.addEventListener("click",async e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,d=t.dataset,up=o=>ck(sb.from("profiles").upsert({id:S.me,...o}));
 try{
 if(a==="tab"){S.tab=d.t;S.draft=null;if(d.t==="chat")markSeen();render(1)}
 else if(a==="zm"){S.zoom=Math.min(6,Math.max(1,S.zoom+ +d.d));render(1)}
 else if(a==="wsel"){S.wsel=d.w;render(1)}
 else if(a==="pick")$("#fi").click();
 else if(a==="cropx")$("#crop").style.display="none";
 else if(a==="send")await sendMsg();
 else if(a==="tag")tagName(d.n);
 else if(a==="atbtn"){const i=$("#ci"),q=i.selectionStart;i.value=i.value.slice(0,q)+"@"+i.value.slice(q);i.focus();i.setSelectionRange(q+1,q+1);showSug()}
 else if(a==="geo")await geocode();
 else if(a==="login"){await ck(sb.auth.signInWithPassword({email:$("#ae").value.trim(),password:$("#ap").value}))}
 else if(a==="signup"){const r=await ck(sb.auth.signUp({email:$("#ae").value.trim(),password:$("#ap").value}));if(!r.data.session)toast("Kiểm tra email để xác nhận tài khoản")}
 else if(a==="logout"){await sb.auth.signOut()}
 else{
 if(a==="cropok"){const o=document.createElement("canvas");o.width=o.height=128;o.getContext("2d").drawImage($("#cv"),0,0,128,128);const nm=$("#fn").value.trim();if(!nm||nm==="Thành viên")return toast("Hãy nhập tên hiển thị trước khi đổi ảnh");$("#crop").style.display="none";await up({name:nm,avatar:o.toDataURL("image/jpeg",.82)});toast("Đã cập nhật ảnh")}
 else if(a==="save"){const n=$("#fn").value.trim();if(!n||n==="Thành viên")return toast("Hãy nhập tên hiển thị của bạn");if(Object.entries(S.P).some(([id,p])=>id!==S.me&&(p.name||"").toLowerCase()===n.toLowerCase()))return toast("Tên này đã có người dùng, hãy thêm họ hoặc biệt danh");const sh=$("#fs").checked;if(sh&&!S.draft)return toast("Hãy tìm địa chỉ hoặc chạm bản đồ để đặt ghim");await up({name:n,ward:$("#fw").value||null,bday:$("#fb").value||null,hide_year:$("#fh").checked,address:sh?$("#fa").value.trim()||null:null,lat:sh?S.draft.lat:null,lng:sh?S.draft.lng:null,share_exact:sh});toast("Đã lưu hồ sơ");S.tab="home"}
 else if(a==="vote")await ck(sb.from("votes").upsert({user_id:S.me,poll_id:d.p,option_id:d.o}));
 else if(a==="newpoll"){const ops=$("#po").value.split("\n").map(x=>x.trim()).filter(Boolean),ti=$("#pt").value.trim();if(!ti||ops.length<2)return toast("Cần tiêu đề và ít nhất 2 lựa chọn");await ck(sb.from("polls").insert({created_by:S.me,title:ti,kind:$("#pk").value,options:ops.map(l=>({id:uid(),label:l}))}));toast("Đã đăng")}
 else if(a==="close"){e.stopPropagation();if(!confirm("Chốt lựa chọn này? Sau khi chốt sẽ không bình chọn thêm được."))return;await ck(sb.from("polls").update({closed:true,winner:d.o,closed_at:new Date().toISOString()}).eq("id",d.p));toast("Đã chốt")}
 else if(a==="delpoll"){if(!confirm("Xóa bình chọn này?"))return;await ck(sb.from("polls").delete().eq("id",d.p))}
 await load();render(1)}
 }catch(err){toast("Lỗi: "+(err.message||err.code))}},true);
document.addEventListener("change",e=>{if(e.target.id!=="fi"||!e.target.files[0])return;const im=new Image();im.onload=()=>{img=im;cz={x:0,y:0,s:1};$("#zm").value=1;$("#crop").style.display="flex";drawCrop()};im.src=URL.createObjectURL(e.target.files[0]);e.target.value=""});
document.addEventListener("input",e=>{if(e.target.id==="zm"){cz.s=+e.target.value;drawCrop()}});
let drag=null;const cv=$("#cv");cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;cz.x+=e.clientX-drag[0];cz.y+=e.clientY-drag[1];drag=[e.clientX,e.clientY];drawCrop()};cv.onpointerup=()=>drag=null;
let sb;
async function load(){const[p,pl,v,ad,ms]=await Promise.all([sb.from("profiles").select("*"),sb.from("polls").select("*"),sb.from("votes").select("*"),sb.from("admins").select("user_id").eq("user_id",S.me),sb.from("messages").select("*").order("created_at",{ascending:false}).limit(100)]);
 S.P={};(p.data||[]).forEach(r=>S.P[r.id]={name:r.name,ward:r.ward,bday:r.bday,hideYear:r.hide_year,avatar:r.avatar,address:r.address,lat:r.lat,lng:r.lng,share:r.share_exact});
 S.polls=(pl.data||[]).map(r=>({id:r.id,createdBy:r.created_by,title:r.title,kind:r.kind,options:r.options,closed:r.closed,winner:r.winner,createdAt:Date.parse(r.created_at),closedAt:r.closed_at?Date.parse(r.closed_at):0}));
 S.V={};(v.data||[]).forEach(r=>{(S.V[r.user_id]=S.V[r.user_id]||{choices:{}}).choices[r.poll_id]=r.option_id});
 S.admin=!!(ad.data&&ad.data.length);S.M=(ms.data||[]).reverse()}
async function start(s){if(!s){S.me=null;return render(1)}S.me=s.user.id;await load();if(!S.P[S.me])S.tab="me";render(1)}
if(!SB_URL||!SB_KEY){S.cfg=false;render(1)}else{sb=supabase.createClient(SB_URL,SB_KEY);
 sb.channel("msgs").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},()=>{if(S.me)load().then(()=>{if(S.tab!=="map"&&S.tab!=="me")render()})}).subscribe();
 sb.auth.onAuthStateChange((ev,s)=>setTimeout(()=>start(s),0));
 setInterval(async()=>{if(S.me){await load();if(S.tab!=="map"&&S.tab!=="me")render()}},20000)}
</script></body></html>
